<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hi, Hannah!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Gochi+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/folders.css">
<script src="assets/common.js"></script>
<style>
:root{--hand:"Gochi Hand","Comic Sans MS","Segoe Print",cursive}
.home-top{position:fixed;top:16px;right:16px;z-index:30}
.home{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;max-width:1400px;margin:0 auto;padding:24px 24px 24px;align-items:start}
@media(max-width:900px){.home{grid-template-columns:1fr;padding:16px 16px 32px;gap:8px}}

/* ---------- Greeting side ---------- */
.hello{position:sticky;top:24px;min-height:calc(100vh - 48px);display:flex;flex-direction:column;justify-content:center;padding:40px 36px;border-radius:32px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;isolation:isolate}
.hello::before{content:"";position:absolute;inset:0;z-index:-2;opacity:.55;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px}
@media(max-width:900px){.hello{position:relative;top:0;min-height:auto;padding:64px 22px 30px}}
.doodles{position:absolute;inset:0;z-index:-1;pointer-events:none}
.dd{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));animation:floaty 6s ease-in-out infinite;animation-delay:var(--dl,0s)}
.dd svg{display:block;width:100%;height:auto;overflow:visible}
.dd.tw{animation:twinkle 3.2s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes floaty{0%,100%{transform:translate(-50%,-50%) rotate(var(--r,0deg))}50%{transform:translate(-50%,calc(-50% - 7px)) rotate(calc(var(--r,0deg) + 4deg))}}
@keyframes twinkle{0%,100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(var(--r,0deg))}50%{opacity:.45;transform:translate(-50%,-50%) scale(.78) rotate(var(--r,0deg))}}
@media(max-width:620px){.dd.opt{display:none}}

.kicker{font-family:var(--hand);font-size:1.25rem;color:var(--muted);margin:0 0 4px;transform:rotate(-2deg);display:inline-block}
.hi{font-family:var(--hand);font-weight:400;font-size:clamp(3.2rem,5.4vw,5.6rem);line-height:.95;margin:0;letter-spacing:1px;color:var(--ink)}
.hi .name{position:relative;display:inline-block;color:var(--rose-d)}
.hi .name svg{position:absolute;left:-9%;top:-14%;width:118%;height:132%;overflow:visible;pointer-events:none}
.hi .name path{fill:none;stroke:var(--rose);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.4s .4s ease forwards}
.hi .wave{display:inline-block;font-size:.55em;vertical-align:.35em;transform-origin:70% 80%;animation:wave 2.4s 1.2s ease-in-out 2}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}}

.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 22px}
.tiles span{font-family:var(--body);font-weight:800;font-size:1.02rem;background:#fff;color:#2c2a33;padding:4px 10px;border-radius:3px;
  outline:2px solid var(--rose);outline-offset:4px;transform:rotate(var(--r));box-shadow:0 2px 0 rgba(0,0,0,.08)}
:root[data-theme="dark"] .tiles span{background:#f7f2ea}

/* Note card (cream card, blue frame, chunky marker text, yellow stars) */
.note{position:relative;max-width:440px;background:#fbf4dd;border:7px solid #8eaed6;border-radius:6px;padding:16px 20px 13px;transform:rotate(-1.5deg);box-shadow:0 10px 26px rgba(80,90,130,.15)}
.note::before{content:"";position:absolute;top:-16px;left:50%;width:96px;height:26px;transform:translateX(-50%) rotate(3deg);background:rgba(242,182,193,.75);border-radius:2px}
.note small{display:block;font-family:var(--hand);font-size:1rem;color:#7d7280;margin-bottom:2px}
.note p{margin:0;font-family:var(--hand);font-size:clamp(1.35rem,2vw,1.8rem);line-height:1.12;color:#25222b;min-height:2.3em;transition:opacity .25s}
.note .ystar{position:absolute;width:62px;opacity:.85;z-index:0;pointer-events:none}
.note p,.note small,.note button{position:relative;z-index:1}
.note button{margin-top:10px;border:0;background:none;font-family:var(--hand);font-size:1.05rem;color:#5c7fae;padding:2px 0;text-decoration:underline wavy rgba(92,127,174,.5);text-underline-offset:4px}
.note button:hover{color:var(--rose-d)}
.hello-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.hello-stats span{font-size:.85rem;font-weight:800;padding:6px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}

/* ---------- Folder shelf ---------- */
.shelf{display:flex;flex-direction:column;min-height:calc(100vh - 48px);padding:26px 4px 0}
@media(max-width:900px){.shelf{min-height:0;padding:22px 0 0}}
.shelf-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 6px 18px}
.shelf-head h2{font-family:var(--hand);font-weight:400;font-size:2.2rem;line-height:1}
.shelf-head .hand{font-family:var(--hand);color:var(--muted);font-size:1.15rem}
 /* Folder carousel: one folder at a time, browse with the arrow buttons, arrow keys, dots or a swipe */
.carousel{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px}
.car-viewport{overflow:hidden;border-radius:24px;touch-action:pan-y}
.car-track{display:flex;transition:transform .55s cubic-bezier(.3,1.15,.4,1)}
.slide{flex:0 0 100%;display:flex;justify-content:center;align-items:center;padding:22px 12px 26px}
.slide .folder{width:min(100%,620px,calc((100vh - 300px) * 1.25))}
.slide .folder.ghost{aspect-ratio:5/4}
.slide .folder .label{padding:10px 16px 11px}
.slide .folder .label b{font-size:1.8rem}
.slide .folder .label small{font-size:.86rem}
.slide .folder .label em{font-size:1.05rem}
.slide .folder .mini{min-width:150px;height:7px}
.car-btn{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);color:var(--ink);display:grid;place-items:center;transition:transform .2s,background .2s}
.car-btn svg{width:24px;height:24px}
.car-btn:hover{transform:scale(1.08);background:var(--rose-t)}
.car-btn:active{transform:scale(.95)}
.car-meta{display:flex;flex-direction:column;align-items:center;gap:6px;margin:2px 0 4px}
.car-name{font-family:var(--hand);font-size:1.25rem;color:var(--ink)}
.car-name small{color:var(--muted);font-size:1rem}
.car-dots{display:flex;justify-content:center;gap:8px}
.car-dots button{width:10px;height:10px;border-radius:99px;border:0;padding:0;background:var(--line);transition:width .3s,background .3s}
.car-dots button.on{width:28px;background:var(--rose)}
@media(max-width:900px){.slide .folder{width:min(100%,460px)}}
@media(max-width:520px){.carousel{gap:6px}.car-btn{width:42px;height:42px}.slide{padding:16px 4px 20px}.slide .folder .label b{font-size:1.4rem}.slide .folder .mini{min-width:100px}}

.folder{position:relative;display:block;aspect-ratio:5/4;color:inherit;text-decoration:none;perspective:900px;
  animation:popin .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d,0ms)}
@keyframes popin{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.folder .backsheet{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 14px rgba(90,70,110,.13))}
.folder .backsheet path{fill:var(--tab)}
.folder .paper{position:absolute;left:7%;right:7%;top:16%;height:62%;border-radius:8px;background:#fffdf8;transition:transform .4s cubic-bezier(.3,1.4,.5,1);
  background-image:repeating-linear-gradient(transparent 0 13px,#e7dccb 13px 14px);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.folder .paper:nth-child(3){left:11%;right:4%;top:19%;transform:rotate(3deg);background-image:none;background-color:#f9efe6}
.folder .front{position:absolute;left:0;right:0;top:21%;bottom:0;border-radius:6px 6px 18px 18px;overflow:hidden;transform-origin:50% 100%;
  transition:transform .4s cubic-bezier(.3,1.3,.5,1),box-shadow .3s;box-shadow:0 -1px 0 rgba(255,255,255,.6) inset,0 8px 18px rgba(90,70,110,.16)}
.folder:hover .front,.folder:focus-visible .front{transform:rotateX(-18deg);box-shadow:0 14px 26px rgba(90,70,110,.22)}
.folder:hover .paper:nth-child(2),.folder:focus-visible .paper:nth-child(2){transform:translateY(-16%)}
.folder:hover .paper:nth-child(3){transform:translateY(-9%) rotate(5deg)}
.folder:focus-visible{outline:none}
.folder:focus-visible .front{outline:3px solid var(--lav);outline-offset:3px}
.folder .doodle{position:absolute;right:6%;top:7%;width:40%;max-width:150px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.08))}
.folder .doodle svg{width:100%;height:auto;display:block}
.folder .label{position:absolute;left:7%;bottom:10%;max-width:64%;padding:7px 12px 8px;border-radius:10px;background:rgba(255,253,248,.93);color:#2c2a33;transform:rotate(-1.5deg);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.folder .label::before{content:"";position:absolute;top:-9px;left:16px;width:46px;height:16px;background:rgba(201,184,232,.7);transform:rotate(-6deg);border-radius:2px}
.folder .label b{display:block;font-family:var(--head);font-weight:700;font-size:1.3rem;line-height:1.1}
.folder .label small{display:block;font-size:.74rem;color:#6d6677;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .mini{display:block;height:6px;border-radius:99px;background:#efe6da;margin-top:6px;overflow:hidden;min-width:100px}
.folder .mini i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#a8c3a0,#c9b8e8,#f2b6c1)}
.folder .label em{display:block;font-style:normal;font-family:var(--hand);font-size:.9rem;color:#7a7489;margin-top:3px;white-space:nowrap}
@media(max-width:900px) and (min-width:521px){.folder .label{max-width:74%;padding:6px 9px 7px}.folder .label b{font-size:1.1rem}.folder .label small{display:none}.folder .mini{min-width:70px}}

/* Ghost folder = coming soon */
.folder.ghost{cursor:default;aspect-ratio:5/3}
.folder.ghost .backsheet{filter:none}
.folder.ghost .backsheet path{fill:none;stroke:var(--muted);stroke-width:.8;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;opacity:.55}
.folder.ghost .front{background:transparent;box-shadow:none;border:2px dashed color-mix(in srgb,var(--muted) 45%,transparent);display:grid;place-items:center;text-align:center}
.folder.ghost:hover .front{transform:none}
.folder.ghost .front span{font-family:var(--hand);font-size:1.25rem;color:var(--muted);padding:0 10px}

/* Folder patterns live in assets/folders.css */
.folder:not(.ghost) .front{background:var(--pat);border:var(--bw,0px) solid transparent}
:root[data-theme="dark"] .folder:not(.ghost) .front,:root[data-theme="dark"] .folder .backsheet{filter:saturate(.88) brightness(.9)}

footer.home-foot{text-align:center;color:var(--muted);font-family:var(--hand);font-size:1.15rem;padding:10px 16px 18px}
footer.home-foot b{font-weight:400;color:var(--rose-d)}
@media (prefers-reduced-motion: reduce){.dd,.folder,.hi .name path,.hi .wave{animation:none!important}.hi .name path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="home-top">
  <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

<div class="home">
  <!-- ============ Greeting ============ -->
  <section class="hello" aria-labelledby="hiTitle">
    <div class="doodles" id="doodles" aria-hidden="true"></div>
    <p class="kicker">✿ welcome back to your study corner</p>
    <h1 class="hi" id="hiTitle">hi, <span class="name">hannah!<svg viewBox="0 0 300 120" preserveAspectRatio="none" aria-hidden="true"><path d="M40,18 C120,2 250,6 288,40 C306,70 250,108 150,110 C60,112 6,92 10,58 C14,30 70,14 130,12"/></svg></span> <span class="wave">👋</span></h1>
    <div class="tiles" id="tiles" aria-label="pick a folder and let's study"></div>
    <div class="note" id="note">
      <svg class="ystar" style="top:-24px;right:-18px" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 63 36 97 38 70 59 80 94 50 74 20 94 30 59 3 38 37 36Z" fill="#f2c94c" stroke="#e5b53a" stroke-width="2" stroke-linejoin="round"/></svg>
      <svg class="ystar" style="bottom:-20px;left:-14px;width:44px" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 63 36 97 38 70 59 80 94 50 74 20 94 30 59 3 38 37 36Z" fill="#f2c94c" stroke="#e5b53a" stroke-width="2" stroke-linejoin="round"/></svg>
      <small>today's little note:</small>
      <p id="noteText">you are not behind</p>
      <button type="button" id="noteBtn">another one ✿</button>
    </div>
    <div class="hello-stats" id="stats"></div>
  </section>

  <!-- ============ Folders ============ -->
  <section class="shelf" aria-labelledby="shelfTitle">
    <div class="shelf-head">
      <h2 id="shelfTitle">my folders</h2>
      <span class="hand">tap a folder to open · ‹ › to browse</span>
    </div>
    <div class="carousel" id="carousel">
      <button class="car-btn" id="carPrev" aria-label="Previous folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="car-viewport" id="carViewport"><div class="car-track" id="folders"></div></div>
      <button class="car-btn" id="carNext" aria-label="Next folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="car-meta">
      <div class="car-name" id="carName" aria-live="polite"></div>
      <div class="car-dots" id="carDots" role="tablist" aria-label="Choose a folder"></div>
    </div>
    <footer class="home-foot">made with love for hannah · <b>love, alex</b> ♡</footer>
  </section>
</div>

<script src="subjects/subjects.js"></script>
<script>
/* ---------------- Little notes ---------------- */
const NOTES = [
  "you are not behind",
  "everything will fall into place, and you will be just fine",
  "remember to live while you're busy surviving",
  "small steps still count",
  "you've learned more than you think",
  "one folder at a time, hannah",
  "breathe, sip some water, then one more card",
  "future pharmacist in progress ♡",
  "rest is part of studying too",
  "proud of you for showing up today"
];
let noteIdx = Math.floor(Math.random() * NOTES.length);
const noteText = document.getElementById('noteText');
noteText.textContent = NOTES[noteIdx];
document.getElementById('noteBtn').onclick = () => {
  noteIdx = (noteIdx + 1 + Math.floor(Math.random() * (NOTES.length - 1))) % NOTES.length;
  noteText.style.opacity = 0;
  setTimeout(() => { noteText.textContent = NOTES[noteIdx]; noteText.style.opacity = 1; }, 220);
};

/* ---------------- Word tiles ---------------- */
document.getElementById('tiles').innerHTML = ["pick","a","folder","&","let's","study"]
  .map((w,i) => `<span style="--r:${[-3,2,-1.5,3,-2,1.5][i]}deg" aria-hidden="true">${w}</span>`).join('');

/* ---------------- Doodle shapes ---------------- */
const C = {pink:"#f4a7c4", lav:"#c4b0ec", butter:"#f6d77a", sky:"#9cc9ef", sage:"#a9d8b0", peach:"#f7c09a", rose:"#e98aa5", mint:"#9fdccb"};
function burst(n, ro, ri){ let d=""; for(let i=0;i<n*2;i++){ const a=Math.PI*i/n - Math.PI/2, r=i%2?ri:ro; d+=(i?"L":"M")+(50+r*Math.cos(a)).toFixed(1)+","+(50+r*Math.sin(a)).toFixed(1);} return d+"Z"; }
const SHAPES = {
  burst: c => `<svg viewBox="0 0 100 100"><path d="${burst(8,48,16)}" fill="${c}" opacity=".85" stroke="${c}" stroke-width="3" stroke-linejoin="round"/></svg>`,
  burst6: c => `<svg viewBox="0 0 100 100"><path d="${burst(6,48,18)}" fill="${c}" opacity=".85" stroke="${c}" stroke-width="3" stroke-linejoin="round"/></svg>`,
  sparkle: c => `<svg viewBox="-50 -50 100 100"><path d="M0,-48 C5,-6 6,-5 48,0 C6,5 5,6 0,48 C-5,6 -6,5 -48,0 C-6,-5 -5,-6 0,-48Z" fill="${c}"/></svg>`,
  star5: c => `<svg viewBox="0 0 100 100"><path d="M50 4 63 36 97 38 70 59 80 94 50 74 20 94 30 59 3 38 37 36Z" fill="${c}" stroke="${c}" stroke-width="5" stroke-linejoin="round"/></svg>`,
  squiggle: c => `<svg viewBox="0 0 120 30"><path d="M4,16 C14,0 24,30 34,15 S54,0 64,15 S84,30 94,15 S110,2 116,12" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/></svg>`,
  curl: c => `<svg viewBox="0 0 60 60"><path d="M30,30 m-4,0 a4,4 0 1,1 8,0 a9,9 0 1,1 -18,0 a14,14 0 1,1 28,2" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/></svg>`,
  heart: c => `<svg viewBox="0 0 100 90"><path d="M50 84C20 62 4 46 4 28 4 14 15 4 28 4c9 0 17 5 22 13C55 9 63 4 72 4c13 0 24 10 24 24 0 18-16 34-46 56Z" fill="${c}"/></svg>`,
  dot: c => `<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="${c}"/></svg>`,
  daisy: () => {
    let petals = ""; for(let i=0;i<10;i++) petals += `<ellipse cx="50" cy="26" rx="7" ry="17" fill="#fff" stroke="#e9e4da" stroke-width="1.4" transform="rotate(${i*36} 50 42)"/>`;
    return `<svg viewBox="0 0 100 170"><path d="M50,60 C46,100 56,130 50,168" stroke="#8cc28a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M50,118 C34,108 24,112 18,104 C30,98 42,104 50,116Z" fill="#9fd19a"/>
      <path d="M44,92 l-12,-8 m12,8 l-14,4 m14,-4 l10,-9 m-10,9 l12,5" stroke="#f2a7bb" stroke-width="3" stroke-linecap="round"/>
      ${petals}<circle cx="50" cy="42" r="9" fill="#f6d36b" stroke="#ebbf48" stroke-width="1.5"/></svg>`;
  }
};
const DOODLES = [
  {t:"burst",  x:7,  y:9,  s:74, c:"pink",  r:-12},
  {t:"burst6", x:86, y:8,  s:58, c:"lav",   r:14, dl:1.2},
  {t:"sparkle",x:64, y:7,  s:26, c:"butter",tw:1},
  {t:"star5",  x:42, y:5,  s:30, c:"butter",r:12, tw:1, dl:.6},
  {t:"daisy",  x:91, y:72, s:74},
  {t:"daisy",  x:5,  y:74, s:58, r:-8, opt:1, dl:2},
  {t:"heart",  x:93, y:36, s:26, c:"rose",  r:12, dl:.8},
  {t:"sparkle",x:4,  y:42, s:22, c:"sky",   tw:1, dl:1.4},
  {t:"squiggle",x:28,y:94, s:96, c:"sky",   r:-4},
  {t:"curl",   x:72, y:94, s:36, c:"rose",  dl:1.6},
  {t:"burst",  x:52, y:93, s:44, c:"sage",  r:20, opt:1, dl:2.2},
  {t:"sparkle",x:80, y:52, s:18, c:"pink",  tw:1, dl:.3, opt:1},
  {t:"dot",    x:20, y:22, s:10, c:"peach", tw:1, dl:1},
  {t:"dot",    x:73, y:24, s:9,  c:"mint",  tw:1, dl:2.4},
  {t:"star5",  x:16, y:58, s:20, c:"lav",   r:-10, tw:1, dl:1.8, opt:1},
  {t:"burst6", x:96, y:94, s:40, c:"peach", r:-6, opt:1, dl:.4}
];
document.getElementById('doodles').innerHTML = DOODLES.map(d =>
  `<span class="dd${d.tw?' tw':''}${d.opt?' opt':''}" style="left:${d.x}%;top:${d.y}%;width:${d.s}px;--r:${d.r||0}deg;--dl:${d.dl||0}s">${SHAPES[d.t](C[d.c])}</span>`).join('');

/* ---------------- Folder doodles (simple original drawings) ---------------- */
const FOLDER_DOODLES = {
  dragonfly: `<svg viewBox="0 0 100 100"><g transform="rotate(-18 50 50)">
    <ellipse cx="33" cy="38" rx="25" ry="9" fill="#cfe9f7" stroke="#6aa6c8" stroke-width="1.6" opacity=".95" transform="rotate(-14 33 38)"/>
    <ellipse cx="67" cy="38" rx="25" ry="9" fill="#cfe9f7" stroke="#6aa6c8" stroke-width="1.6" opacity=".95" transform="rotate(14 67 38)"/>
    <ellipse cx="35" cy="52" rx="21" ry="7" fill="#d8eefb" stroke="#6aa6c8" stroke-width="1.6" opacity=".95" transform="rotate(12 35 52)"/>
    <ellipse cx="65" cy="52" rx="21" ry="7" fill="#d8eefb" stroke="#6aa6c8" stroke-width="1.6" opacity=".95" transform="rotate(-12 65 52)"/>
    <rect x="47" y="34" width="6" height="58" rx="3" fill="#3f8f9c"/><circle cx="50" cy="30" r="6" fill="#2f7684"/>

/* ---------------- Folders ---------------- */
const BACKSHEET = `<svg class="backsheet" viewBox="0 0 100 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0,9 Q0,3 6,3 H33 Q37,3 39.5,6 L43,10.5 H94 Q100,10.5 100,16.5 V74 Q100,80 94,80 H6 Q0,80 0,74 Z"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const subjects = window.SUBJECTS || [];
let mastTotal = 0, qTotal = 0;
const html = subjects.map((s, i) => {
  const total = store.get(s.id + '-total', s.total || 0) || 0;
  const done = Math.min((store.get(s.id + '-mastered', []) || []).length, total || Infinity);
  mastTotal += done; qTotal += total;
  const pct = total ? Math.round(done / total * 100) : 0;
  return `<a class="folder f-${esc(s.folder || 'pastel-pinstripe')}" href="reviewer.html?s=${encodeURIComponent(s.id)}" style="--d:${120 + i*90}ms" aria-label="Open ${esc(s.title)} reviewer">
    ${BACKSHEET}<span class="paper"></span><span class="paper"></span>
    <span class="front">${s.doodle && FOLDER_DOODLES[s.doodle] ? `<span class="doodle">${FOLDER_DOODLES[s.doodle]}</span>` : ''}
      <span class="label"><b>${esc(s.title)}</b><small>${esc(s.subtitle || '')}</small>
        <span class="mini"><i style="width:${pct}%"></i></span><em>${done ? `${done} / ${total} mastered` : `${total} questions · not started`}</em></span>
    </span></a>`;
}).join('');
const ghost = `<div class="folder ghost" style="--d:${120 + subjects.length*90}ms" aria-hidden="true">${BACKSHEET}<span class="front"><span>more folders<br>coming soon 🌱</span></span></div>`;
/* ---------------- Folder carousel ---------------- */
const slides = [...html.split('</a>').filter(h => h.trim()).map(h => h + '</a>'), ghost];
const names = [...subjects.map(s => s.title), 'coming soon'];
const track = document.getElementById('folders');
track.innerHTML = slides.map((h, i) => `<div class="slide" role="group" aria-roledescription="slide" aria-label="${i + 1} of ${slides.length}">${h}</div>`).join('');
document.getElementById('carDots').innerHTML = slides.map((_, i) => `<button role="tab" aria-label="${esc(names[i])}" data-i="${i}"></button>`).join('');
let carIdx = Math.min(Math.max(store.get('bloom-folder-idx', 0) | 0, 0), slides.length - 1);
function showFolder(n){
  carIdx = (n + slides.length) % slides.length;
  track.style.transform = `translateX(-${carIdx * 100}%)`;
  [...track.children].forEach((sl, i) => {
    const on = i === carIdx;
    sl.setAttribute('aria-hidden', on ? 'false' : 'true');
    sl.querySelectorAll('a').forEach(a => a.tabIndex = on ? 0 : -1);
  });
  document.querySelectorAll('#carDots button').forEach((d, i) => { d.classList.toggle('on', i === carIdx); d.setAttribute('aria-selected', i === carIdx); });
  document.getElementById('carName').innerHTML = `${esc(names[carIdx])} <small>· ${carIdx + 1} of ${slides.length}</small>`;
  store.set('bloom-folder-idx', carIdx);
}
document.getElementById('carPrev').onclick = () => showFolder(carIdx - 1);
document.getElementById('carNext').onclick = () => showFolder(carIdx + 1);
document.getElementById('carDots').onclick = e => { const b = e.target.closest('button'); if(b) showFolder(+b.dataset.i); };
document.addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('input, textarea, select')) return;
  if(e.key === 'ArrowLeft') showFolder(carIdx - 1);
  if(e.key === 'ArrowRight') showFolder(carIdx + 1);
});
let touchX = null;
const vp = document.getElementById('carViewport');
vp.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, {passive: true});
vp.addEventListener('touchend', e => {
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if(Math.abs(dx) > 40) showFolder(carIdx + (dx < 0 ? 1 : -1));
});
showFolder(carIdx);

document.getElementById('stats').innerHTML =
  `<span>📂 ${subjects.length} folder${subjects.length === 1 ? '' : 's'}</span><span>🌸 ${mastTotal} / ${qTotal} mastered</span>`;
</script>
</body>
